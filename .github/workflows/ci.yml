name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, tipos, formatação e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  database:
    name: Banco de dados (migrações, regras e concorrência)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lsr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/lsr_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Unit + database tests together, with coverage.
      - run: npm run test:coverage
      # The migrations must apply cleanly on an empty database, then the seed must run.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database lsr_seed'
      - run: npm run db:migrate && npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lsr_seed
          DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/lsr_seed
      - name: Migrations are in sync with the schema
        run: npx drizzle-kit check

  build-e2e:
    name: Build e testes E2E (com agendamento)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lsr_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lsr_e2e
      ENC_ACTIVE_KEY: v1
      # Deterministic CEP lookup (never allowed in production) and booking E2E on.
      FAKE_EXTERNAL_SERVICES: '1'
      BOOKING_E2E: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Throwaway secrets for this CI run only.
      - run: |
          echo "ENC_KEYS=v1:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "BOOKING_SIGNING_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: npm run db:migrate && npm run db:seed
      - run: npm run db:set-base -- --lat -23.5503 --lng -46.6339
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Production dependencies must have no high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high
      # Development dependencies: reported, not blocking.
      - run: npm audit --audit-level=high || true
