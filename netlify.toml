# Netlify + Next.js. The Next.js runtime is declared explicitly: the site was
# created before the app existed, so Netlify did not auto-enable it and served
# the build as plain static files (404 everywhere).
# Docs: docs/runbook.md → "Deploy".

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Production only receives deploys from `main`. Deploy previews are free on the
# Free plan; production deploys cost credits, so we release in batches.
[context.production.environment]
  APP_ENV = "production"

[context.deploy-preview.environment]
  APP_ENV = "preview"

[context.branch-deploy.environment]
  APP_ENV = "preview"
